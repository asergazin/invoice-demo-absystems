services:
  invoice_demo_app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: invoice_demo_app
    restart: unless-stopped
    env_file:
      - .env.production
    ports:
      - "127.0.0.1:3011:3001"
    depends_on:
      invoice_demo_postgres:
        condition: service_healthy

  invoice_demo_postgres:
    image: postgres:16-alpine
    container_name: invoice_demo_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - invoice_demo_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  invoice_demo_postgres_data:
